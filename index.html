<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وقفة منتصف الرحلة | تحدي الإنجاز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#3D6E9A;--deep:#2c5578;--yel:#FFEBB1;--yel2:#ffdf8a;--ink:#23384a;--soft:#6c8398;--line:#d8e3ee}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--blue);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--blue)}
.blob{position:absolute;border-radius:50%;background:var(--yel);opacity:.1}
.b1{width:320px;height:320px;top:-130px;left:-120px}.b2{width:260px;height:260px;bottom:-100px;right:-100px}
header{position:relative;z-index:1;padding:20px 22px 6px;text-align:center;color:#fff}
.brand{font-weight:800;font-size:19px;color:var(--yel)}
.barw{position:relative;margin-top:14px;height:10px;background:rgba(255,255,255,.22);border-radius:10px}
.bar{position:absolute;right:0;top:0;height:100%;width:0;background:var(--yel);border-radius:10px;transition:width .5s}
.bar b{position:absolute;left:-12px;top:-9px;color:var(--yel);font-size:24px;text-shadow:0 0 0 #fff;background:var(--blue);border-radius:50%;line-height:26px;width:26px;height:26px;text-align:center;font-weight:400}
.tag{margin-top:10px;font-size:14px;color:#dbe8f3;min-height:20px}
main{position:relative;z-index:1;flex:1;padding:12px 20px 6px;display:flex;flex-direction:column;justify-content:center}
.card{min-width:0;background:#fff;border-radius:28px;padding:24px 20px;box-shadow:0 14px 34px rgba(0,0,0,.2);animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:34px;font-weight:800;color:var(--blue);line-height:1.4;text-align:center}
h2{font-size:22px;line-height:1.65;font-weight:800;color:var(--blue)}
.hint{font-size:15px;color:var(--soft);margin-top:8px;line-height:1.7}
.star{color:#e6b93c;display:block;text-align:center;font-size:26px;margin:6px 0}
p.lead{font-size:18px;line-height:1.9;text-align:center;margin-top:8px}
.eg{background:var(--yel);border-radius:14px;padding:10px 14px;font-size:14px;color:#6a5313;margin-top:12px;line-height:1.8}
input[type=text],textarea{width:100%;font-family:inherit;font-size:18px;color:var(--ink);background:#f5f9fc;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;outline:none;transition:.2s}
textarea{min-height:100px;resize:none;line-height:1.7}
input:focus,textarea:focus{border-color:var(--blue);background:#fff}
label.l{display:block;margin-top:16px;font-weight:700;font-size:16px;color:var(--blue)}
.chips{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.chips.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.chip{border:2px solid var(--line);background:#f5f9fc;border-radius:18px;padding:13px 14px;font-family:inherit;font-size:17px;color:var(--ink);text-align:right;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.18s}
.chip .m{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #a9bfd3;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;transition:.18s}
.chip.on{background:var(--yel);border-color:var(--blue);font-weight:700;transform:scale(1.02)}
.chip.on .m{background:var(--blue);border-color:var(--blue);color:var(--yel)}
.chip.dis{opacity:.4}
.sl{margin-top:22px}
.sl .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;gap:10px}
.sl .v{background:var(--blue);color:var(--yel);border-radius:12px;min-width:46px;text-align:center;padding:2px 10px;font-size:18px;flex:none}
.sl .v.u{background:#c6d4e1;color:#fff}
input[type=range]{width:100%;margin-top:12px;direction:ltr;appearance:none;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--yel2),var(--blue));outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--blue)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:4px}
footer{position:relative;z-index:1;padding:10px 20px 26px;display:flex;gap:10px;align-items:center}
.btn{font-family:inherit;font-weight:800;font-size:19px;border:none;border-radius:20px;padding:16px;cursor:pointer;transition:.2s}
.next{flex:1;background:var(--yel);color:var(--blue);box-shadow:0 8px 18px rgba(0,0,0,.2)}
.next:active{transform:scale(.97)}
.next:disabled{opacity:.45;box-shadow:none}
.skip{background:transparent;color:#dbe8f3;font-weight:500;font-size:16px;padding:16px 12px}
.back{background:transparent;color:#dbe8f3;font-size:22px;padding:10px;font-weight:500}
.note{text-align:center;font-size:13px;color:#dbe8f3;padding:0 22px 6px;position:relative;z-index:1;min-height:20px}
.priv{background:var(--yel);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.8;margin-top:14px;color:#5b4710}
.out{background:#f5f9fc;border:2px dashed #a9bfd3;border-radius:16px;padding:14px;margin-top:10px;font-size:15px;line-height:1.9;white-space:pre-wrap;max-height:220px;overflow:auto}
.act{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.act a,.act button{font-family:inherit;font-weight:800;font-size:16px;border:none;border-radius:16px;padding:13px 8px;text-align:center;text-decoration:none;color:#fff;background:var(--blue);cursor:pointer;display:block}
.act .full{grid-column:1/3}
.act .tg{background:#2a8fc9}.act .wa{background:#2e9e5b}.act .gr{background:var(--deep)}.act .yl{background:var(--yel);color:var(--blue)}
.act .ok{background:#2e9e5b!important}
.fl{position:fixed;pointer-events:none;color:var(--yel);animation:up 2.8s ease-out forwards;z-index:5}
@keyframes up{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-110vh) rotate(160deg)}}
.cardsum{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardsum div{background:var(--yel);border-radius:16px;padding:10px;text-align:center;font-size:13px;line-height:1.5;color:#5b4710}
.cardsum b{display:block;font-size:26px;color:var(--blue)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.pk{border:3px solid var(--line);border-radius:18px;background:#fff;padding:6px 4px 8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);transition:.2s}
.pk img{width:100%;height:auto;display:block;border-radius:12px}
.pk.on{border-color:var(--blue);background:var(--yel);transform:scale(1.05)}
.big{display:block;margin:14px auto 0;width:78%;border-radius:18px;animation:pop .5s ease}
.cap{text-align:center;font-weight:800;color:var(--blue);margin-top:6px;font-size:18px}
</style>
</head>
<body>
<div class="app">
<div class="blob b1"></div><div class="blob b2"></div>
<header>
<div class="brand">✦ تحديات عين ✦</div>
<div class="barw"><div class="bar" id="bar"><b>✦</b></div></div>
<div class="tag" id="tag"></div>
</header>
<main id="main"></main>
<div class="note" id="note"></div>
<footer id="foot"></footer>
</div>

  return;
 }
 if(s.k==='end'){ finish(); return; }

 let body=`<h2>${s.q}</h2>${s.h?`<div class="hint">${s.h}</div>`:''}`;
 if(s.t==='text'){
  body+=`<textarea id="tx" placeholder="${s.ph||'اكتبي هنا…'}">${esc(A[s.k]||'')}</textarea>`+(s.eg?`<div class="eg">${s.eg}</div>`:'');
 } else if(s.t==='one'||s.t==='multi'){
  body+=`<div class="chips ${s.grid?'grid':''}" id="chips">${s.o.map((o,x)=>`<button class="chip" data-x="${x}"><span class="m">✦</span><span>${o}</span></button>`).join('')}${s.other?`<button class="chip" data-x="oth"><span class="m">✦</span><span>${s.other}</span></button>`:''}</div>${s.other?`<textarea id="ot" style="display:none;min-height:70px" placeholder="اكتبي هنا…">${esc(A[s.k+'_o']||'')}</textarea>`:''}`;
 } else if(s.t==='react'){
  body+=`<div class="pick" id="pick">${CH.map(([n,x],ci)=>`<button class="pk" data-c="${ci}"><img alt="${n}" src="${IMG[x]}"></button>`).join('')}</div><div id="big"></div>`;
 } else if(s.t==='sl'){
  A.sl=A.sl||{};
  body+=SL.map(([id,lab])=>`<div class="sl"><div class="t"><span>${lab}</span><span class="v ${A.sl[id]?'':'u'}" id="v_${id}">${A.sl[id]||'—'}</span></div><input type="range" min="1" max="10" value="${A.sl[id]||5}" data-id="${id}"><div class="ends"><span>10</span><span>1</span></div></div>`).join('');
 }
 m.innerHTML=`<div class="card">${body}</div>`;
 f.innerHTML=`${i>1?'<button class="btn back" id="bk">→</button>':''}<button class="btn next" id="nx">${i===S.length-2?'خلصنا ✦':'التالي'}</button>${s.t==='sl'?'<button class="btn skip" id="sk">تخطي</button>':''}`;
 const upd=()=>{$('nx').disabled=!filled(s)};
 if($('bk'))$('bk').onclick=()=>go(i-1);
 $('nx').onclick=()=>go(i+1);
 if($('sk'))$('sk').onclick=()=>go(i+1);

 if(s.t==='text'){ $('tx').oninput=()=>{A[s.k]=$('tx').value;upd()}; }
 if(s.t==='one'||s.t==='multi'){
  const cur=A[s.k];
  const sel=new Set();
  if(s.t==='one'){ if(cur===OTH)sel.add('oth'); else if(cur)sel.add(s.o.indexOf(cur)); }
  else{ (cur||[]).forEach(v=>sel.add(s.o.indexOf(v))); if(A[s.k+'_oon'])sel.add('oth'); }
  const showOt=()=>{ if($('ot'))$('ot').style.display=sel.has('oth')?'block':'none' };
  const sync=()=>{
   if(s.t==='one') A[s.k]=sel.has('oth')?OTH:(sel.size?s.o[[...sel][0]]:undefined);
   else{ A[s.k]=[...sel].filter(v=>v!=='oth').sort((a,b)=>a-b).map(v=>s.o[v]); A[s.k+'_oon']=sel.has('oth'); }
   if(!sel.has('oth')) A[s.k+'_o']='';
  };
  const paint=()=>{document.querySelectorAll('.chip').forEach(c=>{const x=c.dataset.x==='oth'?'oth':+c.dataset.x;c.classList.toggle('on',sel.has(x));c.classList.toggle('dis',s.t==='multi'&&s.max&&sel.size>=s.max&&!sel.has(x))})};
  paint();showOt();upd();
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
   const x=c.dataset.x==='oth'?'oth':+c.dataset.x;
   if(s.t==='one'){sel.clear();sel.add(x);}
   else{ if(sel.has(x))sel.delete(x); else{ if(s.max&&sel.size>=s.max)return; sel.add(x);} }
   sync();paint();showOt();upd();
   if(s.t==='one'&&x!=='oth'){setTimeout(()=>{if(S[i]===s)go(i+1)},380);}
   if(x==='oth'&&sel.has('oth')&&$('ot'))$('ot').focus();
  });
  if($('ot'))$('ot').oninput=()=>{A[s.k+'_o']=$('ot').value;upd()};
 }
 if(s.t==='sl'){
  document.querySelectorAll('input[type=range]').forEach(r=>{
   const u=()=>{A.sl[r.dataset.id]=+r.value;const v=$('v_'+r.dataset.id);v.textContent=r.value;v.classList.remove('u')};
   r.oninput=u;r.onchange=u;
  });
 }
 if(s.t==='react'){
  const show=()=>{document.querySelectorAll('.pk').forEach(c=>c.classList.toggle('on',A.char===+c.dataset.c));
   if(A.char!=null)$('big').innerHTML=`<img class="big" src="${IMG[CH[A.char][1]]}" alt=""><div class="cap">هذي مرحلتي الآن ✦</div>`};
  document.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{A.char=+b.dataset.c;show();upd();burst()});
  show();
 }
 upd();
}
function burst(){
 for(let n=0;n<26;n++){const e=document.createElement('div');e.className='fl';e.textContent='✦';
  e.style.left=Math.random()*100+'vw';e.style.bottom='-30px';e.style.fontSize=(14+Math.random()*26)+'px';e.style.animationDelay=(Math.random()*1.2)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),4500);}
}
const val=(s)=>A[s.k]===OTH?(A[s.k+'_o']||''):A[s.k];
function build(){
 const g=k=>S.find(x=>x.k===k);
 const J=(k)=>{const s=g(k);let v=A[k];if(Array.isArray(v)){v=[...v];if((A[k+'_o']||'').trim())v.push(A[k+'_o'].trim());return v.join('، ')}return val(s)||''};
 const sl=A.sl||{};
 const who=A.char!=null?CH[A.char][0]:'';
 let t=`✦ وقفة منتصف الرحلة — ${A.name}\n\n`;
 t+=`شعوري الآن: ${J('feel')}\n`;
 if(who)t+=`مرحلتي الآن: ${who}\n`;
 t+=`\nأكثر ما تحسّن بعد انضمامي: ${J('better')}\n`;
 t+=`إدراكي لجسدي: ${J('body')}\n`;
 t+=`أثر قيمي في يومي: ${J('val')}\n`;
 const ks=SL.filter(([id])=>sl[id]);
 if(ks.length)t+=`\nمقياسي (من 10):\n`+ks.map(([id,l])=>`• ${l}: ${sl[id]}`).join('\n')+'\n';
 t+=`\nأريد تعميق: ${J('deep')}\nالدعم الأنفع لي: ${J('sup')}\n`;
 t+=`\nما طبّقته فعلًا: ${J('did')}\nما كاد يوقفني: ${J('stop')}\nرشّحت التحدي لأحد: ${J('rec')}`;
 return t;
}
function finish(){
 $('bar').style.width='100%';$('tag').textContent='';$('note').textContent='';
 const sl=A.sl||{};
 const sum=SL.filter(([id])=>sl[id]);
 const txt=build();const enc=encodeURIComponent(txt);
 $('main').innerHTML=`<div class="card"><h1>شكرًا يا ${esc(A.name)} ✦</h1>
  <p class="lead">وقفتك مع نفسك هي بحد ذاتها خطوة.</p>
  ${A.char!=null?`<img class="big" src="${IMG[CH[A.char][1]]}" alt="">`:''}
  ${sum.length?`<div class="cardsum">${sum.map(([id,l])=>`<div><b>${sl[id]}</b>${l}</div>`).join('')}</div><div class="hint" style="text-align:center">قارنيها بنفسك في نهاية التحدي، لا بأحد غيرك.</div>`:''}
  <div class="priv">إجاباتك تفيدني كثيرًا وتساعدني على تحسين تجربتك في التحدي وتجربة من بعدك.<br><b>لكِ الخيار:</b> إرسالها عبر تيليجرام، أو عبر الإيميل، أو نسخها كما هي.</div>
  <div class="out" id="out">${esc(txt)}</div>
  <div class="act" id="acts">
   <button class="full" id="cp">نسخ الرسالة</button>
   <a class="tg" href="https://t.me/share/url?url=${encodeURIComponent('✦')}&text=${enc}" target="_blank" rel="noopener">إرسال عبر تيليجرام</a>
   <a class="yl" href="mailto:${EMAIL}?subject=${encodeURIComponent('وقفة منتصف الرحلة - '+A.name)}&body=${enc}">إرسال بالإيميل</a>
  </div></div>`;
 $('foot').innerHTML=`<button class="btn back" id="bk">→ رجوع للأسئلة</button>`;
 $('bk').onclick=()=>go(S.length-2);
 $('cp').onclick=()=>{
  const b=$('cp');const done=()=>{b.textContent='تم النسخ ✦';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ الرسالة';b.classList.remove('ok')},2200)};
  const fb=()=>{const r=document.createRange();r.selectNodeContents($('out'));const se=getSelection();se.removeAllRanges();se.addRange(r);try{document.execCommand('copy');done()}catch(e){b.textContent='حددي النص وانسخيه يدويًا'}};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}
 };
 burst();
}
render();
</script>
</body>
</html>
