`.trim().split('\n').map(l=>{const [f,n,k]=l.split('|');return {f,n,k:k.split(',')}});
const NAMES = RAW.map(v=>v.n);
const FAM = n=>{const r=RAW.find(v=>v.n===n);return r?r.f:'c_'+n};

/* أمثلة جاهزة تظهر مع القيمة (أضيفي أمثلة لقيم أخرى هنا متى أردتِ) */
const EXAMPLES = {
 'التمكين':['أستطيع أن أتحرك بخطوة في عملي من اختياري بدل انتظار أحد','حوّلت الفكرة العامة لمشروع مجسّد على أرض الواقع وخطة مرتبة'],
 'الجمال':['عبّرت عن الجمال في مساحتي الشخصية','قدّمت عملي بطريقة فيها جمال وإحسان يشبهني']
};
const EXOPT = ['حصل معي','يشبهني','لم أفكر فيها من قبل'];
const STARTERS = ['تعني لي…','حين أعيشها فعلًا أحس…','وحين أبتعد عنها أشعر…'];

const RINGP='M18 42 C 10 14 80 4 130 8 C 185 12 198 40 170 62 C 140 80 50 76 20 52 C 12 46 14 36 30 28';
const RING = t=>`<span class="ring">${t}<svg viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="${RINGP}"/></svg></span>`;
const $ = id=>document.getElementById(id);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- تطبيع النص العربي واقتراح القيم من الكلمات ---------- */
const norm = s=>String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ئ/g,'ي').replace(/ؤ/g,'و');
function hitsFor(text){
 const t=norm(text);
 const toks=t.split(/[^ء-ي]+/).filter(Boolean);
 const vars=new Set();
 toks.forEach(tk=>{vars.add(tk);['وال','بال','لل','ال','و','ب','ل','ف','ك'].forEach(p=>{if(tk.startsWith(p)&&tk.length>p.length+1)vars.add(tk.slice(p.length))})});
 return RAW.filter(v=>v.k.some(s=>{
  const ns=norm(s);
  if(ns.includes(' '))return t.includes(ns);
  if(ns.length>=4)return toks.some(tk=>tk.includes(ns));
  return vars.has(ns);
 })).map(v=>v.n);
}

/* ---------- الحالة ---------- */
const fresh = ()=>({name:'',imp1:'',imp2:'',ver:'',hits:null,order:null,dec:[],sel:null,viaTrim:false,pk:'',pairs:null,ans:[],rank:null,finals:[],pool:[],verd:{},mean:{},exc:{},mine:{},step:'',custom:[]});
let A = fresh(), scr='welcome', sub=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,scr,sub}))}catch(e){}};
const loadSaved=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.scr==='imp2')s.scr='imp1';return s&&s.A&&s.scr&&s.scr!=='welcome'&&s.A.name?s:null}catch(e){return null}};
const clearSaved=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
function go(s,n){scr=s;sub=n||0;save();render();window.scrollTo(0,0)}

const M=()=>$('main'), F=()=>$('foot');

const backBtn=`<button class="btn back" id="bk">→ رجوع</button>`;
const bind=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};

/* ---------- الرجوع ---------- */
function back(){
 if(scr==='intro')return sub>0?go('intro',sub-1):go('welcome');

function wordsFrom(text){
 const toks=String(text||'').replace(/[ً-ٰٟـ]/g,'').split(/[^ء-ي]+/).filter(Boolean);
 const seen=new Set(),out=[];
 toks.forEach(w=>{
  const n=norm(w),core=n.replace(/^(وال|بال|لل|ال|و)/,'');
  if(core.length<3||STOP.has(n)||STOP.has(core)||seen.has(core)||/(ها|هم|هن)$/.test(n))return;

  seen.add(core);out.push(w.replace(/^(وال|بال|لل)/,m=>m==='وال'?'ال':m==='بال'?'ال':'ال'));
 });

}

/* ---------- المقارنة المتطرفة: أسئلة ذكية ---------- */
function buildPairs(vals,cycles=2,avoid=[]){
 const n=vals.length;let best=null,bestScore=1e9;
 for(let t=0;t<400&&bestScore>0;t++){
  const seen=new Set(avoid),list=[];let score=0;
  for(let c=0;c<cycles;c++){
   const p=shuffle(vals);
   for(let k=0;k<n;k++){
    const a=p[k],b=p[(k+1)%n],key=[a,b].sort().join('|');
    if(seen.has(key)){score+=100;continue}
    seen.add(key);list.push([a,b]);if(FAM(a)===FAM(b))score+=1;
   }
  }
  if(score<bestScore){bestScore=score;best=list}
 }
 /* ترتيب بحيث لا تتكرر نفس القيمة في سؤالين متتاليين قدر الإمكان */
 let bestOrd=best,bo=1e9;
 for(let t=0;t<200&&bo>0;t++){
  const o=shuffle(best);let s=0;
  for(let i=1;i<o.length;i++)if(o[i].some(x=>o[i-1].includes(x)))s++;
  if(s<bo){bo=s;bestOrd=o}
 }
 return bestOrd.map(([a,b])=>Math.random()<.5?[a,b]:[b,a]);
}
const POOL=()=>A.cand||A.sel;
const inPool=x=>POOL().includes(x.a)&&POOL().includes(x.b);
const wins=()=>{const w={};POOL().forEach(v=>w[v]=0);A.ans.filter(inPool).forEach(x=>{if(w[x.w]!=null)w[x.w]++});return w};
/* أسئلة حسم: حتى ٤ أسئلة إضافية بين القيم القريبة من الحد الفاصل (الخامسة/السادسة) */
function nextTie(){
 if(A.ans.length-A.pairs.length>=4)return null;
 const P=POOL(),w=wins(),K=Math.min(TOP,P.length-1),ord=[...P].sort((x,y)=>w[y]-w[x]);
 const edge=(w[ord[K-1]]+w[ord[K]])/2;
 const done=new Set(A.ans.map(x=>[x.a,x.b].sort().join('|'))),c=[];
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
  const a=P[i],b=P[j];
  if(done.has([a,b].sort().join('|')))continue;
  const da=Math.abs(w[a]-edge),db=Math.abs(w[b]-edge);
  if(da<=1&&db<=1)c.push([a,b,da+db+Math.random()*.01]);
 }
 if(!c.length)return null;
 c.sort((x,y)=>x[2]-y[2]);
 const p=c[0];return Math.random()<.5?[p[0],p[1]]:[p[1],p[0]];
}
function finalRank(){
 const P=POOL(),w=wins(),r={};P.forEach(v=>r[v]=Math.random());
 const h2h=(x,y)=>{const a=A.ans.find(q=>(q.a===x&&q.b===y)||(q.a===y&&q.b===x));return a?(a.w===x?-1:1):0};
 const top=[...P].sort((x,y)=>(w[y]-w[x])||h2h(x,y)||(r[x]-r[y]));
 /* القيم التي لم تتقدم للمرحلة الثانية تُرتَّب بعدها حسب فوزها في المرحلة الأولى */
 const w1={};A.sel.forEach(v=>w1[v]=0);A.ans.forEach(x=>{if(w1[x.w]!=null)w1[x.w]++});
 const rest=A.sel.filter(v=>!P.includes(v)).sort((x,y)=>(w1[y]-w1[x])||(Math.random()-.5));
 A.rank=[...top,...rest];
 A.finals=A.rank.slice(0,TOP);A.pool=A.rank.slice(TOP);A.verd={};A.wins=w;
}

R.cmp=()=>{
 const key=A.sel.join('|'),N=A.sel.length;
 if(!A.pairs||A.pk!==key){A.pk=key;A.cand=null;A.pairs=buildPairs(A.sel,N<=CAND?2:1);A.p1len=A.pairs.length;A.ans=[]}
 /* انتهت المرحلة الأولى: تتقدم أعلى القيم فوزًا لمقارنة أدق، بدون أن تحذف العميلة شيئًا */
 if(N>CAND&&!A.cand&&A.ans.length>=A.pairs.length){
  const w={};A.sel.forEach(v=>w[v]=0);A.ans.forEach(x=>{if(w[x.w]!=null)w[x.w]++});
  const r={};A.sel.forEach(v=>r[v]=Math.random());
  A.cand=[...A.sel].sort((x,y)=>(w[y]-w[x])||(r[x]-r[y])).slice(0,CAND);
  const asked=A.ans.map(x=>[x.a,x.b].sort().join('|'));
  A.pairs=[...A.pairs,...buildPairs(A.cand,1,asked)];save();
 }
 const est=N<=CAND?A.pairs.length:N+CAND+2,total=A.pairs.length,done=A.ans.length;let q,extra=false;
 if(done<total)q=A.pairs[done];
 else{q=nextTie();extra=true;if(!q){finalRank();return go('sum')}}
 prog(42+Math.min(done/est,1)*30,'المقارنة',extra?'سؤال حسم أخير ✦':`سؤال ${done+1} من نحو ${Math.max(est,done+1)}`);
 const [a,b]=q;
 M().innerHTML=`<div class="card"><h2>أي حياة تختارين؟</h2><div class="hint">لا يوجد جواب صحيح. اختاري بسرعة.</div><div>

 $('oa').onclick=()=>pick(a,'oa');$('ob').onclick=()=>pick(b,'ob');bind('bk',back);
};

 const opts=[['yes','تشبكت معي'],['maybe','مو متأكدة'],['no','ما تشبهني']];

function wrap(ctx,text,maxW,maxLines){
 const words=String(text).replace(/\s+/g,' ').trim().split(' '),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);
 if(lines.length>maxLines){const l=lines.slice(0,maxLines);let s=l[maxLines-1];while(ctx.measureText(s+'…').width>maxW&&s.length>1)s=s.slice(0,-1);l[maxLines-1]=s+'…';return l}
 return lines;
}
